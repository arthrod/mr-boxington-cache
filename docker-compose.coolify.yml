services:
  cache:
    build:
      context: .
      dockerfile: Dockerfile
      target: coolify
    image: 'mbx-cache-coolify:latest'
    environment:
      MBX_CACHE_LISTEN: '0.0.0.0:7543'
      MBX_CACHE_STORAGE: filesystem
      MBX_CACHE_DATA_DIR: /var/lib/mbx-cache
      MBX_CACHE_DATABASE_URL: 'postgres://mbx_cache:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/mbx_cache'
      MBX_CACHE_DATABASE_MAX_CONNECTIONS: '${MBX_CACHE_DATABASE_MAX_CONNECTIONS:-32}'
      # No tokens: mbx refuses to send one over plain HTTP to anything but
      # loopback, and this cache is reachable only on the private `mbx-cache`
      # network. Every container on that network may read and write.
      MBX_CACHE_ALLOW_ANONYMOUS: 'true'
      MBX_CACHE_MAX_BLOB_BYTES: '${MBX_CACHE_MAX_BLOB_BYTES:-21474836480}'
      RUST_LOG: '${RUST_LOG:-mbx_cache=info,tower_http=info}'
    volumes:
      - 'blobs:/var/lib/mbx-cache'
      - 'staging:/var/tmp/mbx-cache'
    # Every concurrent blob transfer holds a socket and a spool file, and
    # several runners each open dozens at once: Docker's 1024 is too few.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    # Loopback only, for debugging from the host. Runners reach the cache over
    # the shared `mbx-cache` network at http://mbx-cache:7543.
    ports:
      - '127.0.0.1:${MBX_CACHE_HOST_PORT:-7543}:7543'
    networks:
      default: {}
      mbx-cache:
        aliases:
          - mbx-cache
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - curl
        - '-fsS'
        - '-o'
        - /dev/null
        - 'http://127.0.0.1:7543/v1/status'
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
  postgres:
    image: 'postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873'
    environment:
      POSTGRES_DB: mbx_cache
      POSTGRES_USER: mbx_cache
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}'
    # Stock settings checkpoint every 1 GiB of WAL, which a CI fill writes in
    # seconds on a disk the runners already keep busy. The metadata is a cache:
    # a crash may drop the last few rows, which only costs a rebuild.
    command:
      - postgres
      - '-c'
      - shared_buffers=2GB
      - '-c'
      - effective_cache_size=8GB
      - '-c'
      - work_mem=16MB
      - '-c'
      - max_wal_size=8GB
      - '-c'
      - checkpoint_timeout=15min
      - '-c'
      - synchronous_commit=off
    shm_size: 1gb
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - 'postgres-data:/var/lib/postgresql'
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U mbx_cache -d mbx_cache'
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
  # Filesystem storage has no lifecycle rule, so this stands in for one: delete
  # blobs older than the retention window, then the metadata naming them, in
  # that order and with the same age so rows never outlive their objects.
  sweeper:
    build:
      context: .
      dockerfile: Dockerfile
      target: coolify
    entrypoint:
      - sh
      - '-c'
    command:
      - |
        while :; do
          echo "sweep: removing blobs and metadata older than $${MBX_CACHE_RETENTION_DAYS}d"
          find /var/lib/mbx-cache/blobs -type f -mmin +$$(( MBX_CACHE_RETENTION_DAYS * 1440 )) -delete
          find /var/lib/mbx-cache/blobs -mindepth 1 -type d -empty -mmin +60 -delete
          find /var/tmp/mbx-cache -type f -mmin +1440 -delete
          mbx-cache --sweep-metadata-older-than-days "$${MBX_CACHE_RETENTION_DAYS}" && touch /tmp/last-sweep
          sleep "$${MBX_CACHE_SWEEP_INTERVAL_S}"
        done
    environment:
      MBX_CACHE_DATABASE_URL: 'postgres://mbx_cache:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/mbx_cache'
      MBX_CACHE_RETENTION_DAYS: '${MBX_CACHE_RETENTION_DAYS:-30}'
      MBX_CACHE_SWEEP_INTERVAL_S: '${MBX_CACHE_SWEEP_INTERVAL_S:-21600}'
    volumes:
      - 'blobs:/var/lib/mbx-cache'
      - 'staging:/var/tmp/mbx-cache'
    depends_on:
      cache:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - 'test -n "$$(find /tmp/last-sweep -mmin -$$(( MBX_CACHE_SWEEP_INTERVAL_S / 60 + 10 )))"'
      interval: 5m
      timeout: 5s
      retries: 3
      start_period: 2m
    restart: unless-stopped
networks:
  # Fixed name so runner stacks can join it as an external network.
  mbx-cache:
    name: mbx-cache
volumes:
  blobs: null
  staging: null
  postgres-data: null
